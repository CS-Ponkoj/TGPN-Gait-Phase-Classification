name: Publish research report

on:
  push:
    branches: [main]
    paths:
      - report.htm
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare report site
        run: |
          mkdir -p _site
          cp report.htm _site/index.html
          cp report.htm _site/report.htm
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
